<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep navy background gradient with subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2554;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0A2042;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#071830;stop-opacity:1" />
    </linearGradient>

    <!-- Gold flame gradient -->
    <linearGradient id="flameGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD060;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F2B705;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8890A;stop-opacity:1" />
    </linearGradient>

    <!-- Gold bookmark gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B705;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8800A;stop-opacity:1" />
    </linearGradient>

    <!-- White book gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8E4F0;stop-opacity:1" />
    </linearGradient>

    <!-- Inner glow on book pages -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a6e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0A2042;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6e;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle inner shadow for depth -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop shadow for book -->
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Gold glow for flame -->
    <filter id="flamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rounded rectangle clip -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle radial highlight top-center -->
  <radialGradient id="spotLight" cx="50%" cy="20%" r="60%">
    <stop offset="0%" style="stop-color:#1a3a70;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#071830;stop-opacity:0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#spotLight)"/>

  <!-- Very subtle grid texture overlay -->
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="#1a3a6e" stroke-width="0.5" opacity="0.15"/>

  <!-- ══════════════════════════ BOOK ══════════════════════════ -->
  <g filter="url(#bookShadow)" clip-path="url(#roundedClip)">

    <!-- Book spine / base - bottom arc -->
    <path d="M 130 340 Q 256 370 382 340 L 382 355 Q 256 387 130 355 Z" fill="url(#bookGrad)" opacity="0.9"/>

    <!-- Left book cover -->
    <path d="M 128 175 L 128 342 Q 192 332 248 330 L 248 163 Q 192 165 128 175 Z" fill="url(#bookGrad)"/>

    <!-- Right book cover -->
    <path d="M 384 175 L 384 342 Q 320 332 264 330 L 264 163 Q 320 165 384 175 Z" fill="url(#bookGrad)"/>

    <!-- Left cover bracket decoration -->
    <path d="M 136 182 L 136 335" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 136 182 L 152 182" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 136 335 L 152 335" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Right cover bracket decoration -->
    <path d="M 376 182 L 376 335" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 376 182 L 360 182" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 376 335 L 360 335" stroke="#C8D8EA" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Inner left page area -->
    <path d="M 146 190 L 146 328 Q 196 320 248 318 L 248 178 Q 196 180 146 190 Z" fill="url(#pageGrad)"/>

    <!-- Inner right page area -->
    <path d="M 366 190 L 366 328 Q 316 320 264 318 L 264 178 Q 316 180 366 190 Z" fill="url(#pageGrad)"/>

    <!-- Book spine center -->
    <path d="M 248 163 L 264 163 L 264 330 L 248 330 Z" fill="#8AADCC" opacity="0.4"/>

    <!-- Page lines - left side -->
    <path d="M 168 218 Q 210 214 245 213" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 168 238 Q 210 234 245 233" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 168 258 Q 210 254 245 253" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 168 278 Q 210 274 245 273" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M 168 298 Q 210 294 245 293" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- Page lines - right side -->
    <path d="M 344 218 Q 302 214 267 213" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 344 238 Q 302 234 267 233" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 344 258 Q 302 254 267 253" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 344 278 Q 302 274 267 273" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M 344 298 Q 302 294 267 293" stroke="#8AADCC" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- Book bottom curve / base -->
    <path d="M 128 340 Q 256 375 384 340 L 384 348 Q 256 385 128 348 Z" fill="url(#bookGrad)" opacity="0.7"/>

  </g>

  <!-- ══════════════════════════ BOOKMARK ══════════════════════════ -->
  <g filter="url(#flamGlow)">
    <!-- Bookmark ribbon -->
    <path d="M 237 140 L 275 140 L 275 265 L 256 248 L 237 265 Z" fill="url(#bookmarkGrad)"/>
    <!-- Bookmark shine -->
    <path d="M 241 144 L 252 144 L 252 240 L 241 230 Z" fill="#FFE080" opacity="0.35"/>
  </g>

  <!-- ══════════════════════════ FLAME ══════════════════════════ -->
  <g filter="url(#flamGlow)">
    <!-- Outer flame -->
    <path d="M 256 68
             C 265 85 285 95 278 118
             C 272 138 258 143 256 143
             C 254 143 240 138 234 118
             C 227 95 247 85 256 68 Z"
          fill="url(#flameGrad)"/>

    <!-- Inner flame highlight -->
    <path d="M 256 82
             C 261 94 272 101 268 116
             C 265 126 259 131 256 132
             C 255 128 252 122 251 114
             C 249 101 253 91 256 82 Z"
          fill="#FFE878" opacity="0.7"/>

    <!-- Tiny core glow -->
    <ellipse cx="256" cy="118" rx="6" ry="8" fill="#FFFACC" opacity="0.8"/>
  </g>

  <!-- ══════════════════════════ SUBTLE OUTER RING ══════════════════════════ -->
  <rect width="512" height="512" rx="112" ry="112" fill="none"
        stroke="url(#flameGrad)" stroke-width="1.5" opacity="0.2"/>

</svg>
